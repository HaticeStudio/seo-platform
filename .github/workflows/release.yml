name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Verify source
        run: |
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          npx --yes @redocly/cli@2.46.1 lint api/openapi.yaml
          cd console
          npm ci --no-fund --no-audit
          npm audit --audit-level=high
          npm test
          npm run build
          npm run build:lib
      - name: Build release archives
        run: |
          mkdir -p release
          (cd console && npm pack --pack-destination ../release)
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            dir="seo-platform-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "release/$dir"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "release/$dir/seo-platform" ./cmd/seo-platform
            cp LICENSE README.md SECURITY.md VERSIONING.md CHANGELOG.md "release/$dir/"
            cp -R api docs "release/$dir/"
            tar -C release -czf "release/$dir.tar.gz" "$dir"
            rm -rf "release/$dir"
          done
          tar -C console/dist -czf "release/seo-console-app-${GITHUB_REF_NAME}.tar.gz" app
          cd release
          sha256sum *.tar.gz *.tgz > SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/haticestudio/seo-platform:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
