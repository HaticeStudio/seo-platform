# Single-site Quick Start. Every tunable the server understands is passed
# through here explicitly so nothing is silently defaulted away in production.
#
# Required in .env (never commit it):
#   SEO_PUBLIC_URL=https://www.example.com
#   SEO_SECRETS_MASTER_KEY=<openssl rand -hex 32>
#   SEO_API_KEYS=<sha256-of-key>=read,sync,connections.manage
services:
  seo-platform:
    build:
      context: ..
    environment:
      SEO_PUBLIC_URL: ${SEO_PUBLIC_URL:?set the site public URL}
      SEO_SITEMAP_URL: ${SEO_SITEMAP_URL:-}
      SEO_TIMEZONE: ${SEO_TIMEZONE:-UTC}
      SEO_LISTEN: 0.0.0.0:8080
      SEO_DB_PATH: /app/data/seo.db
      SEO_SECRETS_DIR: /app/data/secrets
      SEO_SECRETS_MASTER_KEY: ${SEO_SECRETS_MASTER_KEY:?generate with openssl rand -hex 32}
      SEO_API_KEYS: ${SEO_API_KEYS:?provide sha256(key)=scopes}
      SEO_SYNC_LOOKBACK_DAYS: ${SEO_SYNC_LOOKBACK_DAYS:-30}
      SEO_SYNC_TIMEOUT: ${SEO_SYNC_TIMEOUT:-10m}
      SEO_SYNC_INTERVAL: ${SEO_SYNC_INTERVAL:-24h}
    ports:
      # Loopback by default: put a TLS reverse proxy in front for public access.
      - "127.0.0.1:8080:8080"
    volumes:
      - seo-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  seo-data:
