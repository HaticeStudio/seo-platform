<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEO Platform Console</title>
    <style>
      body {
        margin: 0;
        background: #f8fafc;
      }
      .seo-console-login {
        max-width: 360px;
        margin: 10vh auto;
        display: grid;
        gap: 0.75rem;
        font-family: system-ui, sans-serif;
      }
      .seo-console-login label {
        display: grid;
        gap: 0.25rem;
        font-size: 0.9rem;
      }
      .seo-console-login input {
        padding: 0.4rem 0.6rem;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      .seo-console-login button {
        background: #2563eb;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 0.5rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/standalone.tsx"></script>
  </body>
</html>
